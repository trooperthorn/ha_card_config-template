name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-09-08
      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4, resolved 2026-09-08
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4, resolved 2026-09-08

  audit:
    name: yarn npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-09-08
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, resolved 2026-09-08
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn npm audit --severity moderate --no-deprecations
